set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind C-t send-prefix

set -g mouse on
setw -g mode-keys vi
set-option -g set-clipboard on

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H previous-window
bind L next-window

bind -n M-h previous-window
bind -n M-l next-window

unbind '"'
unbind %

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_status_style "custom"
# set -g @catppuccin_window_status_enable "yes"

set -g status-bg "#c41e3d"

set -g @catppuccin_window_current_number_color "#585b70"
set -g @catppuccin_window_current_text_color  "#000000"
set -g @catppuccin_window_number_color "#313244"
set -g @catppuccin_window_text_color  "#181825"

run '~/.tmux/plugins/tpm/tpm'
